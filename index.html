<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MotionAM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">MA</span>
          <div>
            <h1>MotionAM</h1>
            <p id="statusText">Ready to generate</p>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="undoButton" type="button" title="Undo last scene change" aria-label="Undo last scene change" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-4" /></svg>
          </button>
          <button class="icon-button" id="newProjectButton" type="button" title="New project" aria-label="New project">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="icon-button" id="saveProjectButton" type="button" title="Save project" aria-label="Save project">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" /><path d="M17 21v-8H7v8M7 3v5h8" /></svg>
          </button>
          <button class="icon-button" id="loadProjectButton" type="button" title="Load project" aria-label="Load project">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5M12 15V3" /></svg>
          </button>
          <select class="recent-select" id="recentProjectSelect" title="Recent projects" aria-label="Recent projects">
            <option value="">Recent projects</option>
          </select>
        </div>
      </header>

      <main class="workspace">
        <aside class="prompt-pane">
          <section class="pane-section">
            <div class="section-heading">
              <h2>Prompt</h2>
              <button class="ghost-button" id="exampleButton" type="button">Example</button>
            </div>
            <textarea id="promptInput" spellcheck="true">Create a 10 second kinetic title animation for a tech video intro. Use deep black, electric cyan, warm amber, and crisp white. Show the words "Build The Future" with particles, speed lines, and a final logo lockup.</textarea>
          </section>

          <section class="pane-section edit-section">
            <div class="section-heading">
              <h2>Edit Scene</h2>
            </div>
            <textarea id="editInput" spellcheck="true" placeholder="Change colors, timing, text, camera motion, chart values, or layout"></textarea>
            <button class="secondary-button" id="editButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 20 9-9-4-4-9 9-2 6 6-2Z" /><path d="m15 9 4 4" /></svg>
              Apply Edit
            </button>
          </section>

          <section class="pane-section compact-grid">
            <label>
              <span>Engine</span>
              <select id="engineModeSelect">
                <option value="scene" selected>Scene Engine</option>
                <option value="html">HTML Code</option>
              </select>
            </label>
            <label>
              <span>Length</span>
              <input id="durationInput" type="number" min="3" max="60" step="1" value="10" />
            </label>
            <label>
              <span>Render</span>
              <select id="sizeSelect">
                <option value="1920x1080">16:9 1080p</option>
                <option value="1080x1920">9:16 1080p</option>
                <option value="1080x1080">1:1 1080</option>
                <option value="1080x1350">4:5 1080</option>
                <option value="1280x720">16:9 720p</option>
                <option value="720x1280">9:16 720p</option>
                <option value="3840x2160">16:9 4K</option>
                <option value="2160x3840">9:16 4K</option>
              </select>
            </label>
            <label>
              <span>Style</span>
              <select id="styleSelect">
                <option value="kinetic">Kinetic type</option>
                <option value="product">Product reveal</option>
                <option value="data">Data pulse</option>
                <option value="cinematic">Cinematic opener</option>
              </select>
            </label>
            <label>
              <span>Model</span>
              <input id="modelInput" type="text" value="llama3.2:3b" autocomplete="off" />
            </label>
            <label>
              <span>Record Box</span>
              <select id="recordSizeSelect">
                <option value="render">Same as render</option>
                <option value="1920x1080">16:9 1080p</option>
                <option value="1080x1920">9:16 1080p</option>
                <option value="1080x1080">1:1 1080</option>
                <option value="1080x1350">4:5 1080</option>
                <option value="1280x720">16:9 720p</option>
                <option value="720x1280">9:16 720p</option>
                <option value="3840x2160">16:9 4K</option>
                <option value="2160x3840">9:16 4K</option>
              </select>
            </label>
            <label>
              <span>Format</span>
              <select id="exportFormatSelect">
                <option value="mp4" selected>MP4 for Premiere</option>
                <option value="webm">WebM</option>
              </select>
            </label>
          </section>

          <section class="pane-section">
            <div class="section-heading">
              <h2>AI Provider</h2>
              <label class="switch">
                <input id="useAiToggle" type="checkbox" checked />
                <span>AI</span>
              </label>
            </div>
            <label>
              <span>Provider</span>
              <select id="providerSelect">
                <option value="ollama" selected>Ollama local</option>
                <option value="openrouter">OpenRouter API</option>
                <option value="gemini">Gemini API</option>
                <option value="deepseek">DeepSeek API</option>
              </select>
            </label>
            <label>
              <span>Endpoint</span>
              <input id="endpointInput" type="url" value="http://127.0.0.1:11434/api/chat" autocomplete="off" />
            </label>
            <label>
              <span>API key</span>
              <input id="apiKeyInput" type="password" placeholder="Not needed for Ollama" autocomplete="off" />
            </label>
          </section>

          <div class="primary-actions">
            <button class="primary-button" id="generateButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.7 5.2L19 10l-5.3 1.8L12 17l-1.7-5.2L5 10l5.3-1.8L12 3Z" /><path d="M5 16v5M2.5 18.5h5M19 3v4M17 5h4" /></svg>
              Generate
            </button>
          </div>
        </aside>

        <section class="stage-pane">
          <div class="stage-toolbar">
            <div class="toolbar-left">
              <div class="segmented" role="tablist" aria-label="View mode">
                <button id="previewTab" class="active" type="button">Preview</button>
                <button id="codeTab" type="button">Code</button>
              </div>
              <div class="view-tools" aria-label="Preview zoom">
                <button class="tool-button" id="zoomOutButton" type="button" title="Zoom out" aria-label="Zoom out">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
                </button>
                <button class="ghost-button fit-button" id="fitZoomButton" type="button">Fit</button>
                <span class="zoom-label" id="zoomLabel">Fit</span>
                <button class="tool-button" id="zoomInButton" type="button" title="Zoom in" aria-label="Zoom in">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                </button>
              </div>
            </div>
            <div class="transport">
              <button class="tool-button" id="runButton" type="button" title="Run preview" aria-label="Run preview">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
              </button>
              <button class="tool-button record" id="recordButton" type="button" title="Record" aria-label="Record">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" /></svg>
              </button>
              <button class="tool-button" id="stopButton" type="button" title="Stop recording" aria-label="Stop recording" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg>
              </button>
              <a class="tool-button disabled" id="downloadLink" href="#" download="motionam-motion.mp4" title="Download video" aria-label="Download video">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5M12 15V3" /></svg>
              </a>
            </div>
          </div>

          <div class="timeline-strip" aria-label="Preview timeline">
            <button class="tool-button" id="timelinePlayButton" type="button" title="Play timeline" aria-label="Play timeline">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
            </button>
            <input id="timelineSlider" type="range" min="0" max="10" step="0.01" value="0" aria-label="Timeline position" />
            <span class="timeline-time" id="timelineTime">0:00 / 0:10</span>
          </div>

          <div class="stage-area" id="stageArea">
            <div class="preview-shell" id="previewShell">
              <iframe id="previewFrame" title="Motion preview" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
            <textarea id="codeEditor" spellcheck="false" hidden></textarea>
          </div>
        </section>
      </main>
    </div>

    <input id="projectFileInput" type="file" accept="application/json" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
